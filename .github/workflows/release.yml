name: Build desktop installers
# Builds Windows, macOS and Linux installers and publishes them to GitHub Releases.

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['desktop/**', 'site/app/**', '.github/workflows/release.yml']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle web app
        run: npm run prepare-app
      - name: Prepare macOS runner for DMG creation
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off || true
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
          while pgrep XProtect >/dev/null; do sleep 3; done
      - name: Build & publish installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          for i in 1 2 3; do
            npx electron-builder --publish always && exit 0
            echo "Build attempt $i failed, retrying…"; rm -rf dist; sleep 20
          done
          exit 1
